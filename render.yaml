services:
  - type: web
    name: helio-yajna-solar-detection
    env: docker
    plan: starter
    autoDeploy: false
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: YOLO_CONFIG_DIR
        value: /tmp/Ultralytics
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: ENABLE_SAHI
        value: "false"
      - key: IMG_SIZE
        value: "512"
      - key: MAP_SCALE
        value: "1"
      - key: TORCH_NUM_THREADS
        value: "1"
      - key: TORCH_NUM_INTEROP_THREADS
        value: "1"
      - key: ANALYSIS_WORKERS
        value: "1"
